plugins {
	id 'net.fabricmc.fabric-loom' version '1.19.1'
	id 'idea'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

version = project.mod_version
group = 'net.geforcemods.securitycraft'

base {
	archivesName = 'securitycraft'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

loom {
	accessWidenerPath = file('src/main/resources/securitycraft.accesswidener')

	runs {
		client {
			client()
			runDir 'run/client'
			vmArg '-Dsecuritycraft.mixinAudit=true'
		}
		server {
			server()
			runDir 'run/server'
		}
	}
}

repositories {
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		name = 'Fuzs Mod Resources'
		url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
	}
	exclusiveContent {
		forRepository {
			maven {
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.mc_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Provides NeoForge's ModConfigSpec API on Fabric
	api "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.fcap_version}"
	include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.fcap_version}"

	// optional integrations, only used when the respective mod is installed
	compileOnly "maven.modrinth:jei:b5BXTIh2"
	compileOnly "maven.modrinth:jade:Yo9xOce3"
	compileOnly "maven.modrinth:wthit:XqSFBb4k"
	compileOnly "maven.modrinth:badpackets:SgNrUT3E"
	compileOnly "maven.modrinth:distanthorizons:QHxoccsN"
	compileOnly "maven.modrinth:sodium:tZQ3jqnf"
	compileOnly "maven.modrinth:betterf3:aRWqyAza"
	compileOnly "maven.modrinth:cloth-config:GFM8zh9J"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

processResources {
	exclude '.cache'
	duplicatesStrategy = 'include'
	inputs.property 'version', project.version

	def modVersion = project.version.toString()

	filesMatching('fabric.mod.json') {
		filter { line -> line.replace('${version}', modVersion) }
	}

	//minify json resources
	doLast {
		fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
			File file -> file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
		}
	}
}

tasks.named('jar', Jar).configure {
	exclude('net/geforcemods/securitycraft/datagen/**')
	from('LICENSE')
}

tasks.named('jar', Jar).configure {
	archiveFileName = "[26.1.x] SecurityCraft v${version} (Fabric).jar"
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xmaxerrs' << '10000'
	options.encoding = 'UTF-8'
	options.release = 25
}

sourceSets.main.java {
	// Data generation is NeoForge specific, the generated resources are shipped in src/generated/resources
	exclude 'net/geforcemods/securitycraft/datagen/**'
	exclude 'net/geforcemods/securitycraft/mixin/datagen/**'
}
