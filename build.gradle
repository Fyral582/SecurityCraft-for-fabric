plugins {
	id 'fabric-loom' version '1.17.21'
	id 'idea'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

version = project.mod_version
group = 'net.geforcemods.securitycraft'

base {
	archivesName = 'securitycraft'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
}

loom {
	accessWidenerPath = file('src/main/resources/securitycraft.accesswidener')

	runs {
		client {
			client()
			runDir 'run/client'
			vmArg '-Dsecuritycraft.mixinAudit=true'
		}
		server {
			server()
			runDir 'run/server'
		}
	}
}

repositories {
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		name = 'Fuzs Mod Resources'
		url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
	}
	maven {
		name = 'BlameJared'
		url = 'https://maven.blamejared.com/'
	}
	exclusiveContent {
		forRepository {
			maven {
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.mc_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.mc_version}:${project.parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Provides NeoForge's ModConfigSpec API on Fabric
	modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.fcap_version}"
	include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.fcap_version}"

	// optional integrations, only used when the respective mod is installed
	modCompileOnly "mezz.jei:jei-1.21.5-fabric:21.4.0.27"
	modCompileOnly "maven.modrinth:jade:VNSIKHbV"
	modCompileOnly "maven.modrinth:wthit:onbRW8Ss"
	modCompileOnly "maven.modrinth:badpackets:hjhT2sMz"
	modCompileOnly "maven.modrinth:distanthorizons:Lb7ygvfg"
	modCompileOnly "maven.modrinth:sodium:DA250htH"
	modCompileOnly "maven.modrinth:betterf3:dfWnohnD"
	modCompileOnly "maven.modrinth:cloth-config:qA00xo1O"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

processResources {
	exclude '.cache'
	duplicatesStrategy = 'include'
	inputs.property 'version', project.version

	def modVersion = project.version.toString()

	filesMatching('fabric.mod.json') {
		filter { line -> line.replace('${version}', modVersion) }
	}

	//minify json resources
	doLast {
		fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
			File file -> file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
		}
	}
}

tasks.named('jar', Jar).configure {
	exclude('net/geforcemods/securitycraft/datagen/**')
	from('LICENSE')
}

remapJar {
	archiveFileName = "[${project.mc_version}] SecurityCraft v${version} (Fabric).jar"
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xmaxerrs' << '10000'
	options.encoding = 'UTF-8'
	options.release = 21
}

sourceSets.main.java {
	// Data generation is NeoForge specific, the generated resources are shipped in src/generated/resources
	exclude 'net/geforcemods/securitycraft/datagen/**'
	exclude 'net/geforcemods/securitycraft/mixin/datagen/**'
}
